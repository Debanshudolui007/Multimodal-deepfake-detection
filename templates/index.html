<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimodal Deepfake Detector</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <div class="container glass-panel">
        <header>
            <h1>Deepfake Detector</h1>
            <p>Multimodal Fusion AI (Spatial, Frequency, Audio)</p>
        </header>

        <main>
            <div id="drop-zone" class="drop-zone">
                <div class="upload-icon">
                    <svg viewBox="0 0 24 24" width="48" height="48" stroke="currentColor" stroke-width="2" fill="none">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                </div>
                <h3>Drag & Drop MP4 Video Here</h3>
                <p>or click to browse files</p>
                <input type="file" id="file-input" accept="video/mp4" hidden>
            </div>

            <div id="loading" class="hidden">
                <div class="spinner"></div>
                <p>Analyzing Modalities (Audio, Spatial, Frequency)...</p>
            </div>

            <div id="results" class="hidden">
                <div class="result-header">
                    <h2 id="prediction-text">Prediction</h2>
                    <div class="confidence-bar">
                        <div id="confidence-fill" class="confidence-fill"></div>
                    </div>
                    <p id="confidence-text">Confidence: 0%</p>
                </div>
                
                <div class="analysis-grid">
                    <div class="chart-container">
                        <h3>Attention Modality Weights</h3>
                        <img id="attention-chart" src="" alt="Attention Weights">
                    </div>
                </div>
                
                <button id="reset-btn" class="btn-primary">Analyze Another Video</button>
            </div>
        </main>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
