# ============================================================
# audio.yaml — Audio extraction and feature parameters
# ============================================================

# ── Extraction ───────────────────────────────────────────────
extraction:
  sample_rate: 16000       # Target sample rate (Hz)
  channels: 1              # Mono
  format: "wav"
  codec: "pcm_s16le"

# ── MFCC ─────────────────────────────────────────────────────
mfcc:
  n_mfcc: 40
  use_delta: false         # Appends 1st order derivatives (+40 features)
  use_delta_delta: false   # Appends 2nd order derivatives (+40 features)
  n_fft: 512
  win_length_ms: 25        # 25 ms window → 400 samples at 16kHz
  hop_length_ms: 10        # 10 ms hop → 160 samples at 16kHz
  n_mels: 128              # Mel filterbanks for MFCC computation
  fmin: 0
  fmax: 8000
  normalize: true

# ── Mel Spectrogram ───────────────────────────────────────────
mel:
  n_mels: 128
  n_fft: 512
  win_length_ms: 25
  hop_length_ms: 10
  fmin: 0
  fmax: 8000
  power: 2.0              # Power spectrogram (2.0 = energy)
  normalize: true

# ── Feature Concatenation ─────────────────────────────────────
# Feature dimension is dynamic based on deltas. Defaults: MFCC (40) + Mel (128) = 168
feature_dim: 168

# ── Output ───────────────────────────────────────────────────
output:
  save_wav: true
  save_mfcc: true
  save_mel: true
  save_metadata: true
  dtype: "float32"

# ── Max Audio Duration ────────────────────────────────────────
max_duration_sec: 30      # Truncate/pad to this length
pad_mode: "zero"          # "zero" | "repeat"

# ── Missing Audio Handling ────────────────────────────────────
missing_audio:
  strategy: "zero_tensor"  # Return zeros if no audio track present
  log_missing: true
